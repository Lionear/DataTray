name: Build

# Two rolling builds, one workflow:
#   schedule    -> builds `develop`, publishes the `nightly` release  (what we are working on)
#   push main   -> builds `main`,    publishes the `preview` release  (what has been merged)
#
# GitHub only fires `schedule` from the default branch, so the nightly cannot live on develop: this
# file has to sit on main and check develop out explicitly. Consequence worth remembering — the nightly
# always runs the workflow *as committed on main*, so workflow edits made on develop only take effect
# once merged. Cron is a hint, not a promise: GitHub delays scheduled runs under load, routinely by
# hours (02:00 UTC has been landing near 05:00).
#
# To pause the nightly, comment out the `schedule` block; `workflow_dispatch` keeps manual runs.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to build"
        type: choice
        options: [develop, main]
        default: develop
      version:
        description: "Version stamp (leave empty to derive from Directory.Build.props)"
        required: false
        default: ""
      publish_release:
        description: "Also refresh the rolling release for that branch"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "0 2 * * *"   # nightly (develop) — expect drift, see note above
  push:
    branches: [main]
    tags: ["v*"]       # stable channel: a version tag cuts a real, latest release
    paths-ignore:      # docs / non-code changes shouldn't spend a full build
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".idea/**"
      - "**/*.DotSettings*"

# Superseded push builds cancel each other; scheduled/dispatch runs keep their own
# lane (event_name in the key) so a push never cancels a nightly or a manual run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decide once what we are building and where it lands, so the build matrix and the release job can
  # never disagree about it.
  setup:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.target.outputs.ref }}
      tag: ${{ steps.target.outputs.tag }}
      release_tag: ${{ steps.target.outputs.release_tag }}
      channel: ${{ steps.target.outputs.channel }}
      version: ${{ steps.target.outputs.version }}
    steps:
      # Base checkout only. GitHub fires `schedule`/`push` from the default branch, so this tree is
      # main's regardless of what we build — the base <Version> is fetched from the *target* ref below.
      - uses: actions/checkout@v4

      - name: Resolve ref, channel and version
        id: target
        # Workflow inputs reach bash through env, never through `${{ }}`: GitHub substitutes those
        # textually before the shell parses the line, so an input can close the quote and append
        # commands. Env values are data to bash, whatever they contain.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          IS_TAG=no
          case "$EVENT_NAME" in
            schedule)          REF=develop ;;
            workflow_dispatch) REF="${INPUT_REF:-develop}" ;;
            push)
              if [ "$REF_TYPE" = tag ]; then REF="$REF_NAME"; IS_TAG=yes; else REF=main; fi ;;
            *)                 REF=main ;;
          esac

          # Both branches and tags become a checkout ref (code execution), so gate hard, not via the UI:
          # branch builds are develop/main only; a tag build must be a v<semver> tag.
          if [ "$IS_TAG" = yes ]; then
            if ! printf '%s' "$REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$'; then
              echo "Refusing tag ref: $REF" >&2; exit 1
            fi
          else
            case "$REF" in
              develop|main) ;;
              *) echo "Refusing to build unexpected ref: $REF" >&2; exit 1 ;;
            esac
          fi

          # Channel + two tags. TAG carries the rolling update.json manifest (one per channel). RELEASE_TAG
          # is where the build assets land: the v-tag itself for Stable (a real latest release), the rolling
          # tag otherwise.
          if [ "$IS_TAG" = yes ]; then
            CHANNEL=stable;  TAG=stable;  RELEASE_TAG="$REF"
          elif [ "$REF" = main ]; then
            CHANNEL=preview; TAG=preview; RELEASE_TAG=preview
          else
            CHANNEL=nightly; TAG=nightly; RELEASE_TAG=nightly
          fi

          # Version: Stable takes the tag verbatim (v0.2.0 -> 0.2.0); rolling channels stamp the base
          # <Version> with channel.date.run; an explicit dispatch input overrides.
          if [ "$CHANNEL" = stable ]; then
            VERSION="${REF#v}"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
          else
            # Read the base <Version> from the branch we actually build, NOT from this checked-out tree
            # (which is the default branch for schedule/push). Without this a nightly building develop
            # stamps main's version — the 0.2.0-vs-0.3.0 drift. REF here is a branch (develop|main).
            git fetch --depth=1 origin "$REF" >/dev/null 2>&1 \
              || { echo "Failed to fetch ref '$REF' for version lookup" >&2; exit 1; }
            BASE=$(git show FETCH_HEAD:Directory.Build.props | sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p')
            if [ -z "$BASE" ]; then echo "No <Version> in Directory.Build.props on '$REF'" >&2; exit 1; fi
            VERSION="$BASE-$CHANNEL.$(date -u +%Y%m%d).$RUN_NUMBER"
          fi

          # This value later reaches MSBuild args, pwsh command lines and file names. Keeping it boring
          # (letters/digits/dot/plus/hyphen) is the backstop that also blocks a newline forging output.
          if ! printf '%s' "$VERSION" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9.+-]*$'; then
            echo "Refusing version '$VERSION': expected only letters, digits, dot, plus and hyphen" >&2
            exit 1
          fi

          {
            echo "ref=$REF"
            echo "tag=$TAG"
            echo "release_tag=$RELEASE_TAG"
            echo "channel=$CHANNEL"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Building $REF -> channel '$CHANNEL' (assets on '$RELEASE_TAG', manifest on '$TAG'), version $VERSION"

  build:
    name: ${{ matrix.name }}
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # No PublishSingleFile anywhere since SE-245: the updater replaces an application *folder* and
          # patches it per file, so it needs the files as files. A self-extracting single exe defeats both.
          - name: Windows x64
            os: windows-latest
            rid: win-x64
            platform: win
            mainExe: DataTray.Desktop.exe
            icon: src/DataTray.Desktop/app.ico
          - name: Windows ARM64
            os: windows-latest
            rid: win-arm64
            platform: win
            mainExe: DataTray.Desktop.exe
            icon: src/DataTray.Desktop/app.ico
          - name: Linux AppImage
            os: ubuntu-latest
            rid: linux-x64
            platform: linux
            mainExe: DataTray.Desktop
            icon: src/DataTray.App/Assets/icon.png
          - name: macOS Apple Silicon
            os: macos-14
            rid: osx-arm64
            platform: osx
            mainExe: DataTray.Desktop
            icon: src/DataTray.Desktop/app.icns

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: bash
        # The version is decided once in `setup` (so build and release can't disagree). Re-validate it
        # here as a backstop before it reaches MSBuild args, pwsh command lines and file names.
        env:
          VERSION_IN: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$VERSION_IN"
          if ! printf '%s' "$VERSION" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9.+-]*$'; then
            echo "Refusing version '$VERSION': expected only letters, digits, dot, plus and hyphen" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/DataTray.Desktop/DataTray.Desktop.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:Version=${{ steps.version.outputs.value }} \
            -o publish/${{ matrix.rid }}

      # Packaging is Velopack's since SE-245. It produces the user-facing download *and* the update
      # package and feed for the same channel in one step, which is the point: an installer built
      # separately from the feed is an installer the updater cannot follow. Pinned to the same version
      # as the Velopack PackageReference — that is the only combination Velopack supports.
      - name: Install vpk
        shell: bash
        run: dotnet tool install -g vpk --version 1.2.0

      # vpk derives CFBundleShortVersionString from the pack version and pads it to four components,
      # where Apple allows at most three — so 0.8.0-nightly.99 would ship as 0.8.0.0. The repo's own
      # Info.plist is handed over instead, with the two version fields filled in here. Note that --plist
      # and --bundleId cannot both be given; the bundle id lives in that file.
      - name: Prepare macOS Info.plist
        if: matrix.platform == 'osx'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          # CFBundleVersion takes the version whole — it is a build identifier and may carry the
          # pre-release suffix. CFBundleShortVersionString is the one with the rule, so it drops the
          # suffix and keeps at most three components.
          SHORT=$(printf '%s' "$VERSION" | sed -E 's/[-+].*$//' | cut -d. -f1-3)
          if ! printf '%s' "$SHORT" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "Refusing CFBundleShortVersionString '$SHORT', derived from version '$VERSION'" >&2
            exit 1
          fi

          cp src/DataTray.Desktop/Info.plist Info.plist
          plutil -replace CFBundleShortVersionString -string "$SHORT" Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" Info.plist
          plutil -lint Info.plist

      # --- Packaging ---

      - name: Package (vpk)
        shell: bash
        env:
          # The channel carries the RID, not just the platform: a Velopack feed carries the packages
          # themselves, so one shared "win" feed would offer an x64 package to an arm64 install. Mirrors
          # UpdateChannelExtensions.VelopackChannel, which is what the app asks for.
          CHANNEL: ${{ matrix.rid }}-${{ needs.setup.outputs.channel }}
          VERSION: ${{ steps.version.outputs.value }}
          RID: ${{ matrix.rid }}
          MAIN_EXE: ${{ matrix.mainExe }}
          ICON: ${{ matrix.icon }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          EXTRA=()
          case "$PLATFORM" in
            # Ad-hoc sign the bundle vpk builds. Without it the .app ships with the signature the .NET
            # SDK left on the apphost and no seal around it — no Contents/_CodeSignature, and an
            # identifier of "apphost". macOS reads a signature that claims resources against a bundle
            # that has none as *damaged*, which is the one refusal a user cannot click past. Ad-hoc does
            # not make it trusted, it makes it ordinary: the verdict drops back to "no usable
            # signature", the state every unsigned app is in. Real trust needs the Developer ID from
            # SE-146, and the .pkg needs --signInstallIdentity on top; this flag signs the app only.
            osx)   EXTRA+=(--signAppIdentity - --plist Info.plist) ;;
            linux) EXTRA+=(--categories "Development;Database") ;;
          esac

          # ${EXTRA[@]+…}, not "${EXTRA[@]}": macOS runners ship bash 3.2, where an empty array's
          # expansion is an unbound variable under `set -u` and kills the step. The guarded form
          # expands to nothing when the array is empty and is a no-op on bash 5.
          vpk pack ${EXTRA[@]+"${EXTRA[@]}"} \
            --packId DataTray \
            --packTitle DataTray \
            --packAuthors Lionear \
            --packVersion "$VERSION" \
            --packDir "publish/$RID" \
            --mainExe "$MAIN_EXE" \
            --icon "$ICON" \
            --channel "$CHANNEL" \
            --outputDir artifacts

      # A second macOS download, alongside the .pkg vpk makes. Not a duplicate: Gatekeeper treats the
      # two completely differently. A .pkg is *executed* by Installer.app, so an unsigned one is refused
      # before its payload is touched — and there is nothing for the user to clear, because the app does
      # not exist yet. A .dmg is passive data: it mounts, the app is dragged out, and the ordinary
      # unsigned-app path applies. Until SE-146 buys a Developer ID this is the only macOS download that
      # works without a terminal — and it is also the asset the pre-Velopack updater knows how to open,
      # so the transition bridge in the release job depends on it existing.
      #
      # Built from the Portable.zip rather than a fresh publish, so the image carries exactly what the
      # portable download carries, ad-hoc seal included, instead of a second signing implementation free
      # to drift from the one above.
      - name: Package (macOS dmg)
        if: matrix.platform == 'osx'
        shell: bash
        env:
          CHANNEL: ${{ matrix.rid }}-${{ needs.setup.outputs.channel }}
        run: |
          set -euo pipefail
          ZIP="artifacts/DataTray-$CHANNEL-Portable.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::expected $ZIP from the pack step" >&2
            ls -la artifacts >&2
            exit 1
          fi

          STAGE="$(mktemp -d)"
          # -x __MACOSX/*: zip keeps resource forks in a sibling directory, which would otherwise sit
          # next to the app in the mounted image.
          unzip -q "$ZIP" -d "$STAGE" -x '__MACOSX/*'
          ln -s /Applications "$STAGE/Applications"   # the drag-to-install gesture people expect

          DMG="artifacts/DataTray-$CHANNEL.dmg"

          # hdiutil intermittently fails with "Resource busy" on CI: something (Spotlight indexing the
          # freshly copied staging dir is the usual suspect) still holds it when the image is built. The
          # step is otherwise deterministic, so retry rather than fail a whole build on a race.
          for attempt in 1 2 3; do
            if hdiutil create -volname "DataTray" -srcfolder "$STAGE" -ov -format UDZO "$DMG"; then
              echo "DMG created on attempt $attempt"
              exit 0
            fi
            echo "::warning::hdiutil attempt $attempt failed; retrying in 10s"
            sleep 10
          done

          echo "hdiutil failed three times" >&2
          exit 1


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: artifacts/*
          retention-days: 14
          if-no-files-found: error

  # Publishes each channel's release plus its update.json manifest (the in-app updater's source of truth):
  #   Stable  : a real, latest, non-prerelease release on the v-tag (assets), and a rolling `stable`
  #             release carrying only update.json (links point at the v-tag assets).
  #   Preview : rolling prerelease `preview` with assets + update.json   (main)
  #   Nightly : rolling prerelease `nightly` with assets + update.json   (develop)
  # Download links are stable per channel:
  #   https://github.com/Lionear/DataTray/releases/download/{stable|preview|nightly}/update.json
  # Runs on the scheduled build, on a push (branch or tag), or on a manual run with publish_release ticked.
  release:
    name: Publish ${{ needs.setup.outputs.channel }} release
    needs: [setup, build]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write   # open the changelog-roll sync PR back to develop (Stable only)
    steps:
      # Full history + tags so the changelog can diff against the previous v-tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist   # each artifact lands in dist/<rid>/<file>

      - name: Publish release + update.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ needs.setup.outputs.channel }}
          TAG: ${{ needs.setup.outputs.tag }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
          REF: ${{ needs.setup.outputs.ref }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail

          # One flat dir for the manifest scanner and the upload glob.
          mkdir -p assets
          find dist -type f -exec cp {} assets/ \;

          # vpk also writes Squirrel's legacy RELEASES feed. Nothing we ship reads it — the pre-Velopack
          # client reads update.json and the current one reads releases.<channel>.json — and both Windows
          # RIDs name it plain "RELEASES", so flattening four RIDs into one directory keeps whichever was
          # copied last. Publishing a file that names one architecture's feed and silently carries the
          # other's is worse than not publishing it, so it goes.
          rm -f assets/RELEASES assets/RELEASES-*

          # Release notes are the maintainer-curated CHANGELOG.md [Unreleased] section (Keep a Changelog),
          # not the git log — the changelog is the source of truth for "what changed". An empty section
          # falls back to a neutral line so a release never ships blank notes. On a Stable build the
          # checked-out tree is the v-tag, whose [Unreleased] still holds the pending entries (they are
          # rolled into [VERSION] further down, after the release is published).
          # Fold the changelog fragments (changelog.d/, SE-185) into [Unreleased] first — that is where
          # the pending entries live between releases, so the notes below would otherwise be empty. It
          # edits the working tree only; the roll further down commits the result.
          python3 tools/changelog-render.py || true

          CHANGELOG=CHANGELOG.md tools/changelog-unreleased.sh > notes.md || true
          [ -s notes.md ] || echo "No changes recorded." > notes.md

          # HEAD_REF identifies the built commit for COMMIT/TARGET below: the tag for Stable, the branch
          # tip otherwise.
          if [ "$CHANNEL" = stable ]; then HEAD_REF="$RELEASE_TAG"; else HEAD_REF=HEAD; fi
          COMMIT=$(git rev-parse --short "$HEAD_REF")
          # gh's --target is a target_commitish: only a branch name or a commit SHA is valid, never a tag
          # name. On a Stable build REF is the v-tag (v0.2.0), so pass the resolved commit instead — a SHA
          # is valid for every channel (branch builds resolve HEAD to the branch tip we built).
          TARGET=$(git rev-parse "${HEAD_REF}^{commit}")
          PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # --- The bridge for installs still on the pre-Velopack updater (SE-245) -------------------
          #
          # That updater reads .../releases/download/{stable|preview|nightly}/update.json and applies
          # what it names: a Windows installer it launches, an AppImage it swaps, a DMG it opens. All
          # three land the user in a Velopack-managed install, because Velopack decides "am I managed"
          # from what is on disk, not from an installation record. So the old path only has to reach a
          # Velopack build once.
          #
          # It cannot be a file committed in advance: the three channels cross over at different moments
          # (nightly tonight, preview at the next merge to main, stable at the next tag). Each one
          # freezes itself, the first time it builds a Velopack release.
          #
          # The legacy-* tags are PERMANENT. Unlike the rolling channel tags, which are deleted and
          # recreated on every run, these are never touched again — the frozen update.json points at the
          # assets on its own tag, and recycling that tag would 404 exactly the users this exists for.
          LEGACY_TAG="legacy-$CHANNEL"
          if ! gh release view "$LEGACY_TAG" >/dev/null 2>&1; then
            echo "No $LEGACY_TAG release yet — this is the transition build for '$CHANNEL'. Freezing it."
            CHANNEL="$CHANNEL" VERSION="$VERSION" COMMIT="$COMMIT" PUBLISHED_AT="$PUBLISHED_AT" \
              ASSET_DIR=assets \
              DOWNLOAD_BASE="https://github.com/$GH_REPO/releases/download/$LEGACY_TAG" \
              NOTES_FILE=notes.md OUT=update.json \
              tools/make-update-manifest.sh
            # Uploaded as update.json — that exact name is what the old client requests.
            gh release create "$LEGACY_TAG" assets/* update.json \
              --title "Transition build for the $CHANNEL channel" \
              --notes "Frozen on purpose. The pre-Velopack in-app updater is pointed here, so installs still on the old update method can reach a Velopack build. Never delete this release or its assets." \
              --prerelease --target "$TARGET"
          else
            echo "$LEGACY_TAG already exists — leaving it frozen and reusing its manifest."
            gh release download "$LEGACY_TAG" --pattern update.json --output update.json --clobber
          fi

          # Whatever happened above, update.json now holds the FROZEN manifest, and it is republished onto
          # this channel's rolling tag below so old installs keep finding it. The new updater does not read
          # it at all — it reads vpk's releases.<rid>-<stream>.json from the same release.

          BODY="$(cat notes.md)

          These builds are unsigned / not notarized.
          macOS: after moving to /Applications, clear quarantine: xattr -cr \"/Applications/DataTray.app\".
          Windows: pick the -Setup.exe (per-user, no admin) or the -Portable.zip; SmartScreen may warn on first launch."

          if [ "$CHANNEL" = stable ]; then
            # Real latest release on the human-pushed v-tag (assets here). Delete only the release, never
            # the tag — the tag is what we checked out and what users cite.
            gh release delete "$RELEASE_TAG" --yes || true
            gh release create "$RELEASE_TAG" assets/* \
              --title "DataTray $VERSION" --notes "$BODY" --latest --target "$TARGET"
            # Rolling `stable` pointer, for the pre-Velopack updater only: it carries the frozen
            # update.json, whose asset URLs point at the legacy-stable release rather than at the v-tag
            # above. The Velopack updater never looks here — Stable resolves to
            # /releases/latest/download, which is the v-tag release the assets were just uploaded to.
            gh release delete "$TAG" --yes --cleanup-tag || true
            gh release create "$TAG" update.json \
              --title "Stable channel manifest (pre-Velopack updater)" \
              --notes "Update manifest read by the pre-Velopack in-app updater. It points at the frozen legacy-stable release, which is the build that carries those installs across." \
              --latest=false --target "$TARGET"

            # Archive the notes we just shipped: roll CHANGELOG.md's [Unreleased] into [VERSION] on the
            # default branch and push it back. Only CHANGELOG.md changes, and *.md is in paths-ignore, so
            # this commit does not re-trigger a build. Best-effort — a protected branch or a push race
            # must never fail an already-published release; on failure the maintainer rolls it by hand.
            if git fetch origin main \
               && git checkout -B main origin/main \
               && python3 tools/changelog-render.py \
               && VERSION="$VERSION" DATE="$(date -u +%Y-%m-%d)" REPO="$GH_REPO" \
                    CHANGELOG=CHANGELOG.md tools/changelog-roll.sh \
               && ! git diff --quiet -- CHANGELOG.md changelog.d; then
              git config user.name  "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              # -A so the folded-in fragments are removed by the same commit that archives them.
              git add -A CHANGELOG.md changelog.d
              git commit -m "chore(release): roll changelog for $VERSION"
              if git push origin main; then
                ROLL_SHA=$(git rev-parse HEAD)
                # The roll only ran on main; develop still carries the shipped notes under [Unreleased]
                # (plus any next-version work merged since promotion). Cherry-pick the same commit onto
                # develop through a PR so the roll never drifts (the 0.3.0 gap that needed PR #44 by hand).
                # A PR, not a direct push: when develop has advanced the cherry-pick conflicts, and the PR
                # is where that gets resolved. Best-effort — never fail an already-published release.
                SYNC_BRANCH="chore/changelog-roll-$VERSION"
                if ! git ls-remote --exit-code --heads origin develop >/dev/null 2>&1; then
                  # develop is gone. Merging the release PR with "delete branch" deletes the
                  # integration branch itself, which is how 0.5.0 lost it (SE-200). Nothing can be
                  # lost in that state — main's head is the roll on top of everything develop held —
                  # so recreate it there rather than only warn: that is what the sync PR would have
                  # produced anyway. Only safe because the branch is *absent*; never force a branch
                  # that exists.
                  if git push origin "$ROLL_SHA:refs/heads/develop"; then
                    echo "::warning::develop was missing (deleted by the release merge?) and has been recreated at the changelog roll ($ROLL_SHA)"
                  else
                    echo "::warning::develop is missing and could not be recreated; branch it off main by hand"
                  fi
                elif git fetch origin develop && git checkout -B "$SYNC_BRANCH" origin/develop; then
                  if git cherry-pick -x "$ROLL_SHA"; then
                    if git push -f origin "$SYNC_BRANCH"; then
                      gh pr create --base develop --head "$SYNC_BRANCH" \
                        --title "chore(release): sync $VERSION changelog roll to develop" \
                        --body "Automated after the $VERSION release: cherry-picks the changelog roll ($ROLL_SHA) so develop's history files the shipped notes under \`[$VERSION]\`. Merge to keep \`[Unreleased]\` clean." \
                        || echo "::warning::changelog sync PR create failed; open a develop<-main changelog PR by hand"
                    else
                      echo "::warning::changelog sync branch push failed; open a develop<-main changelog PR by hand"
                    fi
                  else
                    git cherry-pick --abort || true
                    echo "::warning::changelog roll conflicts on develop; open a develop<-main changelog PR and resolve [Unreleased] by hand"
                  fi
                else
                  echo "::warning::could not check out develop for changelog sync; open a develop<-main changelog PR by hand"
                fi
              else
                echo "::warning::changelog roll-back push failed; roll [Unreleased] into [$VERSION] in CHANGELOG.md manually"
              fi
            else
              echo "::warning::changelog roll-back skipped (nothing to roll or checkout failed); verify CHANGELOG.md"
            fi
          else
            if [ "$TAG" = nightly ]; then TITLE="Nightly build (develop)"; else TITLE="Preview build (main)"; fi
            # Recreate the rolling release so tag, date and notes track the latest build. Target the branch
            # we built: on a scheduled run GITHUB_SHA is main's head, but the artifacts came from develop.
            gh release delete "$TAG" --yes --cleanup-tag || true
            gh release create "$TAG" assets/* update.json \
              --title "$TITLE" --notes "$BODY" --prerelease --target "$TARGET"
          fi
